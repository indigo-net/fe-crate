name: Update Codebase

on:
  pull_request:
    types: [closed]

jobs:
  update-codebase:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 디렉토리별 분석 및 docs 생성
        run: |
          # 기존 codebase.txt 삭제 (있는 경우)
          rm -f codebase.txt

          # src 하위 디렉토리별로 repomix 실행
          for dir in src/*/ ; do
            if [ -d "$dir" ]; then
              # 디렉토리명 추출 (예: src/features/ -> features)
              dirname=$(basename "$dir")
              echo "Processing directory: $dirname"
              
              # 해당 디렉토리에 대해 repomix 실행 및 src/{dirname}.md로 저장
              # --style markdown 사용하여 .md 형식으로 생성
              npx -y repomix "$dir" --output "src/${dirname}.md" --style markdown
            fi
          done

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update directory-based codebase documentation [skip ci]" || echo "No changes to commit"
          git push
