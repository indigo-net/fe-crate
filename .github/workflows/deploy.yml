name: Deploy Frontend to AWS Amplify (Dev)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          echo "🚀 의존성 설치를 시작합니다..."
          pnpm install --frozen-lockfile

      - name: Build Project
        run: |
          echo "🏗️ 프로젝트 빌드 중 (Vite)..."
          pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to AWS Amplify
        run: |
          echo "📦 1. 빌드 결과물(dist) 압축 중..."
          cd dist && zip -r ../deploy.zip . && cd ..
          echo "✅ 압축 완료: deploy.zip"

          echo "🔗 2. AWS Amplify 배포 생성 중..."
          DEPLOY_INFO=$(aws amplify create-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name dev --output json)
          
          # 값 추출
          UPLOAD_URL=$(echo $DEPLOY_INFO | jq -r '.zipUploadUrl')
          JOB_ID=$(echo $DEPLOY_INFO | jq -r '.jobId')

          echo "ℹ️ 생성된 Job ID: $JOB_ID"
          # 보안을 위해 URL 전체보다는 성공 여부만 확인
          if [ -n "$UPLOAD_URL" ]; then echo "✅ 업로드 URL 생성 성공"; fi

          echo "📤 3. AWS S3로 파일 업로드 시작..."
          curl -s -X PUT --upload-file deploy.zip "$UPLOAD_URL"
          echo "✅ 업로드 완료"

          echo "🚀 4. Amplify 배포 프로세스 시작 (Job ID: $JOB_ID)..."
          aws amplify start-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name dev --job-id $JOB_ID
          
          echo "🎉 모든 배포 명령이 성공적으로 전달되었습니다!"
          echo "🌐 AWS 콘솔에서 배포 진행 상황을 확인하세요."
