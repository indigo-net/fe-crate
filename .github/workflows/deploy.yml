name: Deploy Frontend to AWS Amplify (Dev)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. pnpm 설치 (GitHub Runner에는 pnpm이 기본 설치되어 있지 않습니다)
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8 # 사용 중인 pnpm 버전에 맞게 수정 (보통 8 또는 9)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm' # npm 대신 pnpm 캐시를 사용하여 속도 향상

      # 2. 의존성 설치 (pnpm-lock.yaml 기준 설치)
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 3. 빌드 (pnpm run build)
      - name: Build Project
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to AWS Amplify
        run: |
          # 1. 빌드 결과물 압축 (Vite+pnpm은 기본적으로 dist 폴더를 생성합니다)
          cd dist && zip -r ../deploy.zip . && cd ..

          # 2. 배포 업로드 URL 생성 (브랜치명 dev 확인)
          UPLOAD_URL=$(aws amplify create-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name dev --query 'zipUploadUrl' --output text)

          # 3. 파일 업로드
          curl -X PUT --upload-file deploy.zip "$UPLOAD_URL"

          # 4. 배포 시작
          aws amplify start-deployment --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name dev
